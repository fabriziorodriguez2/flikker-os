version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: flikker-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: flikker_os
    ports:
      - "5432:5432"
    volumes:
      - flikker_postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    container_name: flikker-redis
    restart: unless-stopped
    ports:
      - "6379:6379"

volumes:
  flikker_postgres_data: